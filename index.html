<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Merdeka AR</title>

<!-- A-Frame: the 3D/AR scene framework. MindAR: the image-tracking engine
     that finds your printed picture in the camera and plays a video on it. -->
<script>
  // Belt-and-suspenders: some Android/Chrome builds offer to pair a
  // Google Cardboard viewer on ANY WebVR-capable page, independent of
  // A-Frame's own vr-mode-ui setting. Removing the legacy WebVR API
  // before A-Frame loads stops that prompt from being offered at all.
  navigator.getVRDisplays = undefined;
</script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }

  /* Tap-to-start screen — required so the video is allowed to play with
     sound. Phones block sound on any video that starts without a real tap. */
  #startScreen {
    position: fixed; inset: 0; z-index: 20;
    background: linear-gradient(160deg, #010066 0%, #cc0001 100%);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  #startScreen h1 { font-size: 26px; margin: 0 0 8px; }
  #startScreen p  { font-size: 14px; opacity: .85; max-width: 320px; line-height: 1.6; margin: 0 0 28px; }
  #startBtn {
    background: #fc0; color: #010066; border: none; border-radius: 999px;
    padding: 16px 40px; font-size: 17px; font-weight: 700; cursor: pointer;
  }

  /* Small hint bar shown once scanning has started */
  #scanHint {
    position: fixed; left: 0; right: 0; bottom: 24px; z-index: 10;
    text-align: center; color: #fff; font-size: 14px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none;
  }
</style>
</head>
<body>

  <div id="startScreen">
    <h1>Selamat Hari Merdeka 🇲🇾</h1>
    <p>Point your phone's camera at the picture to see it come alive.</p>
    <button id="startBtn">Start Camera</button>
  </div>

  <div id="scanHint">Point the camera at the picture…</div>

  <!--
    imageTargetSrc points at the compiled target file — see targets.mind
    below. You get that file by uploading YOUR photo to MindAR's free
    online compiler (link in the instructions further down).
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false; cardboardModeEnabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <!-- Swap this src for your own video file -->
      <video
        id="merdekaVideo"
        src="./assets/video.mp4"
        preload="auto"
        loop="false"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex: 0 = the first (only) image in targets.mind.
         Adjust height to match your video's real aspect ratio:
         height = width * (video height / video width). -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- 1.33 matches Zara's video (896x1194 portrait) -->
      <a-video src="#merdekaVideo" width="1" height="1.33" position="0 0 0" rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene   = document.querySelector('a-scene');
    const video   = document.querySelector('#merdekaVideo');
    const target  = document.querySelector('[mindar-image-target]');
    const startEl = document.getElementById('startScreen');
    const hintEl  = document.getElementById('scanHint');

    document.getElementById('startBtn').addEventListener('click', async () => {
      // One real tap "unlocks" audio playback for the whole session.
      try { await video.play(); video.pause(); video.currentTime = 0; } catch (e) {}
      startEl.style.display = 'none';
      scene.systems['mindar-image-system'].start();   // now turn the camera on
    });

    target.addEventListener('targetFound', () => {
      hintEl.style.display = 'none';
      video.currentTime = 0;
      video.play();
    });

    target.addEventListener('targetLost', () => {
      hintEl.style.display = 'block';
      video.pause();
    });
  </script>
</body>
</html>
