<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Merdeka AR</title>

<!-- A-Frame: the 3D/AR scene framework. MindAR: the image-tracking engine
     that finds your printed picture in the camera and plays a video on it. -->
<script>
  // Belt-and-suspenders: some Android/Chrome builds offer to pair a
  // Google Cardboard viewer on ANY WebVR-capable page, independent of
  // A-Frame's own vr-mode-ui setting. Removing the legacy WebVR API
  // before A-Frame loads stops that prompt from being offered at all.
  navigator.getVRDisplays = undefined;
</script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }

  /* Tap-ANYWHERE-to-start screen — required so the video is allowed to
     play with sound. Phones block camera + audio unless a real tap
     triggers them; making the whole screen the tap target (not just a
     small button) keeps this to one instant tap, no button-hunting. */
  #startScreen {
    position: fixed; inset: 0; z-index: 20; cursor: pointer;
    background: linear-gradient(160deg, #010066 0%, #cc0001 100%);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  #startScreen h1  { font-size: 28px; margin: 0 0 10px; }
  #startScreen .tap-hint {
    margin-top: 22px; font-size: 15px; font-weight: 700; color: #fc0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  /* iOS will not decode frames for a video inside a display:none container —
     the clip reports itself as "playing" while the plane stays black. A-Frame
     hides <a-assets> by default, so keep it technically on-screen: 1px, fully
     transparent, behind everything, untouchable. */
  a-assets {
    display: block !important;
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    overflow: hidden; opacity: 0; z-index: -1; pointer-events: none;
  }

  /* Small hint bar shown once scanning has started */
  #scanHint {
    position: fixed; left: 0; right: 0; bottom: 24px; z-index: 10;
    text-align: center; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8);
    pointer-events: none; padding: 0 16px;
  }
  #scanHint .greeting { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  #scanHint .sub      { font-size: 13px; opacity: .9; }
</style>
</head>
<body>

  <div id="startScreen">
    <h1>Selamat Hari Merdeka 🇲🇾</h1>
    <div class="tap-hint">Tap anywhere to begin</div>
  </div>

  <div id="scanHint">
    <div class="greeting">Selamat Hari Merdeka Malaysia 🇲🇾</div>
    <div class="sub">Point the camera at the picture…</div>
  </div>

  <!--
    imageTargetSrc points at the compiled target file — see targets.mind
    below. You get that file by uploading YOUR photo to MindAR's free
    online compiler (link in the instructions further down).
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false; cardboardModeEnabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <!-- Swap this src for your own video file -->
      <video
        id="merdekaVideo"
        src="./assets/video.mp4"
        preload="auto"
        loop="false"
        muted
        playsinline
        webkit-playsinline
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex: 0 = the first (only) image in targets.mind.
         Adjust height to match your video's real aspect ratio:
         height = width * (video height / video width). -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- 1.25 matches Zara's video (720x900 portrait, from a 1080x1350 original) -->
      <!-- shader:flat skips lighting math on the video plane - lighter GPU
           load, which matters on iOS where video-as-texture is already heavy -->
      <a-video src="#merdekaVideo" width="1" height="1.25" position="0 0 0" rotation="0 0 0" material="shader: flat"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene   = document.querySelector('a-scene');
    const video   = document.querySelector('#merdekaVideo');
    const target  = document.querySelector('[mindar-image-target]');
    const startEl = document.getElementById('startScreen');
    const hintEl  = document.getElementById('scanHint');

    // iOS only lets a video with an AUDIO TRACK start from a real user
    // gesture. `targetFound` fires from MindAR's tracking loop, which is NOT
    // one — so the video has to be UNLOCKED during the tap, and every later
    // play() rides on that unlock. The previous clip had no audio at all,
    // which is why this only broke when the new one was dropped in.
    let audioUnlocked = false;

    startEl.addEventListener('click', async () => {
      // Play-then-pause during the gesture is what unlocks the element for the
      // rest of the session. Unmute FIRST so the unlock covers audio too.
      try {
        video.muted = false;
        await video.play();
        video.pause();
        video.currentTime = 0;
        audioUnlocked = true;
      } catch (e) {
        // Audio was refused. Fall back to unlocking it MUTED, so the video
        // still appears — a silent clip beats a black square.
        try {
          video.muted = true;
          await video.play();
          video.pause();
          video.currentTime = 0;
        } catch (e2) { note('Video could not be prepared: ' + (e2.message || e2)); }
      }
      startEl.style.display = 'none';
      scene.systems['mindar-image-system'].start();   // now turn the camera on
    });

    target.addEventListener('targetFound', () => {
      hintEl.style.display = 'none';
      video.currentTime = 0;
      video.muted = !audioUnlocked;
      const p = video.play();
      if (p && p.catch) {
        p.catch(() => {
          // Last resort: some iOS builds still refuse the unmuted play here.
          // Retry silent rather than leave the plane blank.
          video.muted = true;
          video.play().catch(err => note('Playback blocked: ' + (err.message || err)));
        });
      }
    });

    target.addEventListener('targetLost', () => {
      hintEl.style.display = 'block';
      video.pause();
    });

    // A phone has no console. If the video genuinely cannot play, say so on
    // screen instead of showing a silent black plane and leaving you guessing.
    function note(msg) {
      let el = document.getElementById('diag');
      if (!el) {
        el = document.createElement('div');
        el.id = 'diag';
        el.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:30;' +
          'background:rgba(0,0,0,.82);color:#ffd166;font:600 12px/1.5 -apple-system,sans-serif;' +
          'padding:8px 10px;border-radius:8px;text-align:center';
        document.body.appendChild(el);
      }
      el.textContent = msg;
    }
    video.addEventListener('error', () => {
      const e = video.error;
      note('Video file error (code ' + (e ? e.code : '?') + ') — check assets/video.mp4 uploaded fully.');
    });
  </script>
</body>
</html>
